name: Build and check a deck
# Click "Run workflow" in the Actions tab, fill in the form, download the "deck-report" artifact.
on:
  workflow_dispatch:
    inputs:
      commander: { description: "Commander name", required: true, default: "Grolnok, the Omnivore" }
      tribe:     { description: "Creature type to emphasize (blank = auto)", default: "Frog" }
      budget:    { description: "Approx USD budget", default: "400" }
      max_gc:    { description: "Game Changer cap (3 = Bracket 3, 0 = Bracket 2)", default: "3" }
      target:    { description: "Target bracket", default: "3" }
      big_spell: { description: "Mana value of your biggest finisher", default: "8" }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COMMANDER: ${{ inputs.commander }}
      TRIBE: ${{ inputs.tribe }}
      BUDGET: ${{ inputs.budget }}
      MAX_GC: ${{ inputs.max_gc }}
      TARGET: ${{ inputs.target }}
      BIG: ${{ inputs.big_spell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: day
        run: echo "d=$(date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4            # one Scryfall download per day, reused across runs
        with:
          path: data/cards.json
          key: cards-${{ steps.day.outputs.d }}
      - name: Fetch Scryfall data (skipped if cached today)
        run: test -s data/cards.json || python src/fetch_cards.py
      - name: Build deck
        run: python src/build_deck.py --commander "$COMMANDER" --tribe "$TRIBE" --budget "$BUDGET" --max-gc "$MAX_GC"
      - name: Goldfish simulation
        run: python src/goldfish.py out/deck.txt --tribe "$TRIBE" --big-spell "$BIG"
      - name: Bracket report
        run: python src/bracket_report.py out/deck.txt --target "$TARGET"
      - uses: actions/upload-artifact@v4
        with: { name: deck-report, path: out/ }

name: Forge playtest (slow, optional)
# UNTESTED in Actions. Runs a few full Commander games of your deck vs. bundled precons.
on:
  workflow_dispatch:
    inputs:
      deck_path: { description: "Deck list in this repo (first line = commander)", default: "out/deck.txt" }
      games:     { description: "Number of games (each is a separate 4-player match)", default: "6" }
      per_game_seconds: { description: "Timeout per game", default: "900" }
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Download Forge (latest release)
        run: |
          TAG=$(curl -sIL -o /dev/null -w '%{url_effective}' https://github.com/Card-Forge/forge/releases/latest | sed 's#.*/tag/##')
          VER=${TAG#forge-}
          curl -sL -o forge.tar.bz2 "https://github.com/Card-Forge/forge/releases/download/$TAG/forge-installer-$VER.tar.bz2"
          mkdir forge && tar xjf forge.tar.bz2 -C forge
      - name: Prepare decks (yours + 3 random precons)
        run: |
          mkdir -p decks && cd src && python to_forge.py "../${{ inputs.deck_path }}" ../decks/Mine.dck Mine && cd ..
          ls forge/res/quest/commanderprecons/*.dck | shuf -n 3 --random-source=<(yes) | while read f; do cp "$f" "decks/P_$(basename "$f" | tr -c 'A-Za-z0-9.\n' _)"; done
          ls decks
      - name: Play games
        run: |
          mkdir -p results; cd forge
          for i in $(seq 1 ${{ inputs.games }}); do
            timeout ${{ inputs.per_game_seconds }} java -Xmx4g -Djava.awt.headless=true -jar forge-gui-desktop-*-jar-with-dependencies.jar \
              sim -D "$GITHUB_WORKSPACE/decks" -d Mine.dck $(cd ../decks && ls P_*.dck | tr '\n' ' ') -f commander -n 1 -c ${{ inputs.per_game_seconds }} \
              > "../results/game_$i.log" 2>&1 || echo "game $i timed out" >> ../results/summary.txt
          done
          cd ..; grep -il "won" results/game_*.log | wc -l | xargs echo "games with a recorded winner:" >> results/summary.txt
          grep -ih "won\|winner" results/game_*.log | head -50 >> results/summary.txt || true
      - uses: actions/upload-artifact@v4
        with: { name: forge-results, path: results/ }
